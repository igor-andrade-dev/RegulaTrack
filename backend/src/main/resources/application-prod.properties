spring.application.name=regulatrack

# =========================
# DATABASE
# =========================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================
# FLYWAY
# =========================
spring.flyway.enabled=true

# =========================
# SEED
# =========================
app.seed.enabled=${APP_SEED_ENABLED:false}

# =========================
# PASSWORD RESET / MAIL
# =========================
app.frontend.base-url=${APP_FRONTEND_BASE_URL}
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@regulatrack.local}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# =========================
# DOCUMENT STORAGE
# =========================
app.documents.storage-path=${APP_DOCUMENTS_STORAGE_PATH:/tmp/regulatrack-documents}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# SERVER
# =========================
server.port=${PORT:10000}
