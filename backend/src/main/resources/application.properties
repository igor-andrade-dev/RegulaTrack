spring.application.name=regulatrack

# =========================
# DATABASE (DOCKER)
# =========================
spring.datasource.url=jdbc:postgresql://postgres:5432/regulatrack
spring.datasource.username=regulatrack
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# FLYWAY
# =========================
spring.flyway.enabled=true

# =========================
# SEED (IMPORTANTE)
# =========================
app.seed.enabled=true
# =========================
# PASSWORD RESET / MAIL
# =========================
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:4200}
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@regulatrack.local}

# SMTP values can be supplied through environment variables when mail is enabled.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

# =========================
# DOCUMENT STORAGE
# =========================
app.documents.storage-path=${APP_DOCUMENTS_STORAGE_PATH:/app/storage/documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
