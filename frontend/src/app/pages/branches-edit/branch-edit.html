<main class="entity-page">
  <header class="entity-header">
    <div>
      <span class="eyebrow">MANAGEMENT / BRANCHES</span>
      <h1>Edit Branch</h1>
      <p>Update operational unit information.</p>
    </div>
    <a [routerLink]="['/branches', branchId]" class="back-link">Back to Details</a>
  </header>

  @if (errorMessage) { <div class="alert error">{{ errorMessage }}</div> }

  @if (loading) {
    <section class="loading-card"><div class="spinner"></div><span>Loading branch data...</span></section>
  }

  @if (!loading && !errorMessage) {
    <section class="edit-card">
      <div class="section-heading">
        <div>
          <h2>Branch Information</h2>
          <p>Update the fields below and save your changes.</p>
        </div>
      </div>

      <form (ngSubmit)="submit()">
        <div class="form-grid">
          <div class="form-field">
            <label for="companyId">Company</label>
            <select id="companyId" name="companyId" required [(ngModel)]="form.companyId">
              <option [ngValue]="null">Select a company</option>
              @if (companies$ | async; as companies) {
                @for (company of companies; track company.id) {
                  <option [ngValue]="company.id">{{ company.name }}</option>
                }
              }
            </select>
          </div>

          <div class="form-field">
            <label for="name">Branch Name</label>
            <input id="name" name="name" type="text" required [(ngModel)]="form.name" />
          </div>

          <div class="form-field wide">
            <label for="address">Address</label>
            <input id="address" name="address" type="text" [(ngModel)]="form.address" />
          </div>

          <div class="form-field">
            <label for="city">City</label>
            <input id="city" name="city" type="text" [(ngModel)]="form.city" />
          </div>

          <div class="form-field">
            <label for="state">State</label>
            <input id="state" name="state" type="text" [(ngModel)]="form.state" />
          </div>

          <div class="form-field">
            <label for="country">Country</label>
            <input id="country" name="country" type="text" [(ngModel)]="form.country" />
          </div>
        </div>

        <div class="form-actions">
          <a [routerLink]="['/branches', branchId]" class="button button-secondary">Cancel</a>
          <button type="submit" class="button button-primary" [disabled]="saving">
            {{ saving ? 'Saving...' : 'Save Changes' }}
          </button>
        </div>
      </form>
    </section>
  }
</main>
