<main class="company-edit-page">

  <header class="company-edit-header">
    <div>
      <span class="company-edit-eyebrow">RegulaTrack</span>
      <h1>Edit Company</h1>
      <p>Update company registration data.</p>
    </div>
  </header>

  <section class="edit-toolbar">
    <div>
      <strong>Editing company</strong>
      <span>Update the fields below and save your changes.</span>
    </div>

    <a [routerLink]="['/companies', companyId]" class="edit-toolbar-action">
      Back to Details
    </a>
  </section>

  @if (loading) {
    <p class="company-edit-state">Loading company data...</p>
  }

  @if (errorMessage) {
    <p class="form-error">{{ errorMessage }}</p>
  }

  @if (!loading && !errorMessage) {

    <section class="form-card">

      <form (ngSubmit)="submit()">

        <div class="form-grid">

          <div class="form-field">
            <label>Name</label>
            <input name="name" [(ngModel)]="form.name" required />
          </div>

          <div class="form-field">
            <label>Document Number</label>
            <input name="documentNumber" [(ngModel)]="form.documentNumber" required />
          </div>

          <div class="form-field">
            <label>Segment</label>
            <input name="segment" [(ngModel)]="form.segment" />
          </div>

          <div class="form-field">
            <label>Country</label>
            <input name="country" [(ngModel)]="form.country" />
          </div>

          <div class="form-field">
            <label>City</label>
            <input name="city" [(ngModel)]="form.city" />
          </div>

        </div>

        <div class="form-actions">

          <button type="submit" [disabled]="saving">
            {{ saving ? 'Saving...' : 'Save Changes' }}
          </button>

          <a [routerLink]="['/companies', companyId]" class="cancel-link">
            Cancel
          </a>

        </div>

      </form>

    </section>

  }

</main>
