<main class="auth-page"><section class="auth-card"><div class="auth-brand"><span>R</span><div><strong>RegulaTrack</strong><small>Compliance Platform</small></div></div><div class="auth-copy"><span>ACCOUNT RECOVERY</span><h1>Reset your password</h1><p>Create a new password for your RegulaTrack account.</p></div>@if(success){<div class="auth-success"><strong>Password updated</strong><span>Your password has been changed. Redirecting to Sign In...</span></div>} @else {<form (ngSubmit)="submit()"><label for="password">New Password</label><div class="password-wrap"><input id="password" name="password" type="password" [(ngModel)]="password" autocomplete="new-password" placeholder="Enter a new password" required /></div><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" name="confirmPassword" type="password" [(ngModel)]="confirmPassword" autocomplete="new-password" placeholder="Confirm your new password" required />@if(errorMessage){<div class="auth-error">{{errorMessage}}</div>}<button type="submit" [disabled]="loading">{{loading?'Updating...':'Update Password'}}</button></form>}<a routerLink="/login" class="auth-back">Back to Sign In</a></section></main>
